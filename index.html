// ============================================
// LECTURE DES EXTRAITS PDF (BNP Paribas Fortis)
// ============================================

// Un montant belge s'écrit "1.245,50" (point = milliers, virgule = décimales)
function parseMontantBE(str, sign) {
  if (!str) return 0;
  const cleaned = str.replace(/\./g, "").replace(",", ".");
  const val = parseFloat(cleaned) || 0;
  return sign === "-" ? -val : val;
}

function lineText(line) {
  return line.items.map((i) => i.text).join(" ").replace(/\s+/g, " ").trim();
}

// Récupère le texte présent uniquement dans une tranche horizontale de la page
// (utilisé pour isoler la colonne "Contrepartie")
function bucketText(line, minX, maxX) {
  return line.items.filter((i) => i.x >= minX && i.x < maxX).map((i) => i.text).join(" ").trim();
}

async function extractLinesFromPdf(file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const lines = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const viewport = page.getViewport({ scale: 1 });
    const content = await page.getTextContent();
    const width = viewport.width;
    const byY = {};
    content.items.forEach((item) => {
      const y = Math.round(item.transform[5]);
      if (!byY[y]) byY[y] = [];
      byY[y].push({ x: item.transform[4], text: item.str });
    });
    const ys = Object.keys(byY).map(Number).sort((a, b) => b - a);
    ys.forEach((y) => {
      const items = byY[y].sort((a, b) => a.x - b.x);
      lines.push({ page: p, width, items });
    });
  }
  return lines;
}

const DATE_ONLY_RE = /^(\d{2})\s*-\s*(\d{2})\s*-\s*(\d{4})$/;
const TX_START_RE = /^(\d{3,4})\s+(.*)$/;
const LAST_LINE_RE = /(\d{2}\s*-\s*\d{2})\s+([\d.,]+)\s*([+-])\s*$/;

function buildTransactionsFromLines(lines) {
  const results = [];
  let currentDate = null;
  let current = null;

  const flush = () => {
    if (current && current.montantStr) {
      results.push(finalizeTx(current));
    }
    current = null;
  };

  lines.forEach((line) => {
    const text = lineText(line);
    if (!text) return;

    if (/^Solde/.test(text)) { flush(); return; }

    const dateOnly = text.match(DATE_ONLY_RE);
    if (dateOnly) {
      flush();
      currentDate = `${dateOnly[3]}-${dateOnly[2]}-${dateOnly[1]}`;
      return;
    }

    const txMatch = text.match(TX_START_RE);
    if (txMatch && currentDate) {
      // Nouvelle transaction. Sur ces relevés, le N°, le début de la description,
      // la date valeur et le montant apparaissent sur cette même première ligne.
      flush();
      current = { numero: txMatch[1], dateOperation: currentDate, descLines: [], contrepartieLines: [] };
      let rest = txMatch[2];
      const lastMatch = rest.match(LAST_LINE_RE);
      if (lastMatch) {
        current.dateValeur = lastMatch[1].replace(/\s+/g, "");
        current.montantStr = lastMatch[2];
        current.sign = lastMatch[3];
        rest = rest.slice(0, lastMatch.index).trim();
      }
      if (rest) current.descLines.push(rest);
      const c = bucketText(line, line.width * 0.50, line.width * 0.72);
      if (c) current.contrepartieLines.push(c);
      return;
    }

    if (current) {
      // Cas rare : date valeur / montant sur une ligne séparée plutôt que sur la première ligne.
      if (!current.montantStr) {
        const lastMatch = text.match(LAST_LINE_RE);
        if (lastMatch) {
          current.dateValeur = lastMatch[1].replace(/\s+/g, "");
          current.montantStr = lastMatch[2];
          current.sign = lastMatch[3];
          return;
        }
      }
      current.descLines.push(text);
      const c = bucketText(line, line.width * 0.50, line.width * 0.72);
      if (c) current.contrepartieLines.push(c);
    }
  });
  flush();
  return results;
}

function finalizeTx(tx) {
  const description = tx.descLines.join(" ").replace(/\s+/g, " ").trim();
  const contrepartie = tx.contrepartieLines.join(" ").replace(/\s+/g, " ").trim();
  const refMatch = description.match(/R[ée]f[ée]rence banque\s*:\s*(\S+)/i);
  const montant = parseMontantBE(tx.montantStr, tx.sign);
  const [dd, mm] = (tx.dateValeur || "").split("-");
  const year = tx.dateOperation ? tx.dateOperation.slice(0, 4) : String(new Date().getFullYear());
  const dateValeurISO = dd && mm ? `${year}-${mm}-${dd}` : null;
  return {
    tempId: "p" + Math.random().toString(36).slice(2),
    numero: tx.numero,
    description,
    contrepartie,
    dateOperation: tx.dateOperation,
    dateValeur: dateValeurISO,
    montant,
    type: tx.sign === "-" ? "expense" : "income",
    referenceBanque: refMatch ? refMatch[1] : null,
  };
}

// ============================================
// NOUVEAU FORMAT BNP (depuis février) — un PDF par transaction,
// présentation "Détails de la transaction" (Label / Valeur), sans tableau.
// ============================================
function isIndividualTransactionPdf(lines) {
  return lines.some((l) => /D[ée]tails de la transaction/i.test(lineText(l)));
}

function parseIndividualTransactionText(lines) {
  const texts = lines.map(lineText).filter(Boolean);
  const get = (re) => {
    for (const t of texts) {
      const m = t.match(re);
      if (m) return m[1].trim();
    }
    return null;
  };

  const deVal = get(/^De\s+(.*)$/);
  const versVal = get(/^Vers\s+(.*)$/);
  const montantStr = get(/^Montant\s+(.*)$/);
  const dateExec = get(/^Date d.ex[ée]cution\s+(.*)$/i);
  const dateCompta = get(/^Date de comptabilisation\s+(.*)$/i);
  const numSeq = get(/^N[°o]?\s*de\s*s[ée]quence\s+(.*)$/i);

  // Le bloc "Détails" peut s'étaler sur plusieurs lignes visuelles
  const detailsStartIdx = texts.findIndex((t) => /^D[ée]tails\s/i.test(t) && !/^D[ée]tails de la transaction/i.test(t));
  let detailsText = "";
  if (detailsStartIdx !== -1) {
    const collected = [texts[detailsStartIdx].replace(/^D[ée]tails\s*/i, "")];
    for (let i = detailsStartIdx + 1; i < texts.length; i++) {
      if (/^N[°o]?\s*de\s*s[ée]quence/i.test(texts[i])) break;
      collected.push(texts[i]);
    }
    detailsText = collected.join(" ").replace(/\s+/g, " ").trim();
  }

  if (!montantStr || !dateExec) return null;

  const montantMatch = montantStr.match(/(-?)\s*([\d.,]+)\s*EUR/i);
  const sign = montantMatch && montantMatch[1] === "-" ? "-" : "+";
  const montant = montantMatch ? parseMontantBE(montantMatch[2], sign) : 0;

  const execMatch = dateExec.match(/(\d{2})\.(\d{2})\.(\d{4})/);
  const dateOperation = execMatch ? `${execMatch[3]}-${execMatch[2]}-${execMatch[1]}` : null;

  const refMatch = detailsText.match(/R[ée]f[ée]rence banque\s*:\s*(\S+)/i);
  const dateValeurMatch = detailsText.match(/Date valeur\s*:\s*(\d{2})\/(\d{2})\/(\d{4})/i);

  let dateValeur = dateOperation;
  if (dateValeurMatch) {
    dateValeur = `${dateValeurMatch[3]}-${dateValeurMatch[2]}-${dateValeurMatch[1]}`;
  } else if (dateCompta) {
    const c = dateCompta.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    if (c) dateValeur = `${c[3]}-${c[2]}-${c[1]}`;
  }

  const contrepartie = (sign === "-" ? versVal : deVal) || "";

  return {
    tempId: "p" + Math.random().toString(36).slice(2),
    numero: numSeq || "",
    description: detailsText || contrepartie,
    contrepartie,
    dateOperation,
    dateValeur,
    montant,
    type: sign === "-" ? "expense" : "income",
    referenceBanque: refMatch ? refMatch[1] : null,
  };
}

async function parsePdfToTransactions(file) {
  const lines = await extractLinesFromPdf(file);
  if (isIndividualTransactionPdf(lines)) {
    const tx = parseIndividualTransactionText(lines);
    return tx ? [tx] : [];
  }
  return buildTransactionsFromLines(lines);
}

function proposeCategory(description, categories) {
  const upper = description.toUpperCase();
  const match = categories.find((c) => upper.includes(c.mot_cle.toUpperCase()));
  return match ? match.categorie : "À catégoriser";
}

function isProbableDuplicate(candidate, existingTransactions) {
  return existingTransactions.some((t) => t.date === candidate.dateOperation && Math.abs(t.amount - Math.abs(candidate.montant)) < 0.01);
}

// ============================================
// CHARGEMENT / SAUVEGARDE DES DONNÉES (Supabase)
// ============================================
function useTrackerData() {
  const [data, setDataState] = useState(null);
  const [saveError, setSaveError] = useState(false);
  const [loadError, setLoadError] = useState(false);

  const loadAll = useCallback(async () => {
    setLoadError(false);
    try {
      const [settingsRes, recurringRes, txRes, catRes] = await Promise.all([
        supabase.from("Suivi_Tresorerie_settings").select("*").eq("id", 1).single(),
        supabase.from("Suivi_Tresorerie_recurring").select("*").order("created_at"),
        supabase.from("Suivi_Tresorerie_transactions").select("*").order("date"),
        supabase.from("Suivi_Tresorerie_categories").select("*").order("created_at"),
      ]);
      if (settingsRes.error) throw settingsRes.error;
      if (recurringRes.error) throw recurringRes.error;
      if (txRes.error) throw txRes.error;
      if (catRes.error) throw catRes.error;

      setDataState({
        settings: {
          openingBalance: settingsRes.data.opening_balance,
          openingDate: settingsRes.data.opening_date,
          alertThreshold: settingsRes.data.alert_threshold,
        },
        recurring: recurringRes.data.map(r => ({
          id: r.id, label: r.label, amount: r.amount, type: r.type, day: r.day,
        })),
        transactions: txRes.data.map(t => ({
          id: t.id, date: t.date, label: t.label, amount: t.amount, type: t.type, category: t.category,
          dateValeur: t.date_valeur, numeroOperation: t.numero_operation, contrepartie: t.contrepartie,
          referenceBanque: t.reference_banque, source: t.source,
        })),
        categories: catRes.data,
      });
    } catch (e) {
      console.error(e);
      setLoadError(true);
    }
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  return { data, setDataState, saveError, setSaveError, loadError, reload: loadAll };
}

function daysInMonth(year, monthIndex) {
  return new Date(year, monthIndex + 1, 0).getDate();
}

function buildEvents(recurring, transactions) {
  const events = [];
  recurring.forEach((r) => {
    const signed = r.type === "expense" ? -Math.abs(r.amount) : Math.abs(r.amount);
    for (let m = 0; m < 12; m++) {
      const wantedDay = r.day || 1;
      const day = Math.min(wantedDay, daysInMonth(2026, m));
      const date = `2026-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      events.push({ date, amount: signed, label: r.label, month: m });
    }
  });
  transactions.forEach((t) => {
    const signed = t.type === "expense" ? -Math.abs(t.amount) : Math.abs(t.amount);
    const month = new Date(t.date + "T00:00:00").getMonth();
    events.push({ date: t.date, amount: signed, label: t.label, month, category: t.category });
  });
  events.sort((a, b) => (a.date < b.date ? -1 : 1));
  return events;
}

function buildWeeks(openingDate) {
  const start = new Date(openingDate + "T00:00:00");
  const weeks = [];
  let cursor = new Date(start);
  for (let i = 0; i < 53; i++) {
    const wStart = new Date(cursor);
    const wEnd = new Date(cursor);
    wEnd.setDate(wEnd.getDate() + 6);
    if (wStart.getFullYear() > 2026) break;
    weeks.push({ index: i + 1, start: wStart, end: wEnd });
    cursor.setDate(cursor.getDate() + 7);
  }
  return weeks;
}

function dateInRange(dateStr, start, end) {
  const d = new Date(dateStr + "T00:00:00");
  return d >= start && d <= end;
}

function MiniChart({ points, threshold }) {
  const W = 880, H = 200, padL = 50, padR = 10, padT = 10, padB = 24;
  if (!points.length) return null;
  const values = points.map((p) => p.balance);
  const max = Math.max(...values, threshold, 0);
  const min = Math.min(...values, 0);
  const range = max - min || 1;
  const x = (i) => padL + (i / (points.length - 1 || 1)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - min) / range) * (H - padT - padB);

  const path = points.map((p, i) => `${i === 0 ? "M" : "L"} ${x(i).toFixed(1)} ${y(p.balance).toFixed(1)}`).join(" ");

  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: 220 }}>
      <line x1={padL} x2={W - padR} y1={y(0)} y2={y(0)} stroke="#dc2626" strokeDasharray="4 4" />
      <line x1={padL} x2={W - padR} y1={y(threshold)} y2={y(threshold)} stroke="#d97706" strokeDasharray="4 4" />
      <text x={padL} y={y(0) - 4} fontSize="10" fill="#dc2626">0 €</text>
      <text x={padL} y={y(threshold) - 4} fontSize="10" fill="#d97706">seuil</text>
      <path d={path} fill="none" stroke="#0f172a" strokeWidth="2" />
      {points.filter((_, i) => i % 4 === 0).map((p, idx) => {
        const i = idx * 4;
        return <text key={i} x={x(i)} y={H - 6} fontSize="9" fill="#94a3b8" textAnchor="middle">S{p.index}</text>;
      })}
    </svg>
  );
}

// ============================================
// IMPORT PDF — tableau de vérification
// ============================================
// ============================================
// CHAMP CATÉGORIE AVEC AUTOCOMPLÉTION
// Propose les catégories déjà encodées dès la première lettre.
// Entrée = valide la suggestion surlignée (et déclenche onSubmit si fourni).
// Clic sur une suggestion = même résultat, sans clavier.
// ============================================
function CategoryInput({ value, onChange, suggestions, placeholder, style, inputStyle, onSubmit, disabled, autoFocus }) {
  const [open, setOpen] = useState(false);
  const [highlight, setHighlight] = useState(0);

  const typed = (value || "").trim().toLowerCase();
  const filtered = typed
    ? (suggestions || []).filter((s) => s.toLowerCase().startsWith(typed) && s.toLowerCase() !== typed)
    : [];

  useEffect(() => { setHighlight(0); }, [value]);

  const selectSuggestion = (s) => {
    onChange(s);
    setOpen(false);
    if (onSubmit) onSubmit(s);
  };

  const handleKeyDown = (e) => {
    if (open && filtered.length > 0) {
      if (e.key === "ArrowDown") { e.preventDefault(); setHighlight((h) => Math.min(h + 1, filtered.length - 1)); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); setHighlight((h) => Math.max(h - 1, 0)); return; }
      if (e.key === "Enter") { e.preventDefault(); selectSuggestion(filtered[highlight]); return; }
      if (e.key === "Escape") { setOpen(false); return; }
    } else if (e.key === "Enter" && onSubmit) {
      e.preventDefault();
      onSubmit(value);
    }
  };

  return (
    <div style={{ position: "relative", ...style }}>
      <input
        style={{ width: "100%", ...inputStyle }}
        value={value || ""}
        placeholder={placeholder}
        disabled={disabled}
        autoFocus={autoFocus}
        onChange={(e) => { onChange(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setOpen(false)}
        onKeyDown={handleKeyDown}
      />
      {open && filtered.length > 0 && (
        <div style={{ position: "absolute", top: "100%", left: 0, right: 0, zIndex: 20, background: "#fff", border: "1px solid var(--border)", borderRadius: 8, marginTop: 2, maxHeight: 160, overflowY: "auto", boxShadow: "0 4px 10px rgba(0,0,0,.08)" }}>
          {filtered.map((s, i) => (
            <div
              key={s}
              onMouseDown={(e) => { e.preventDefault(); selectSuggestion(s); }}
              style={{ padding: "6px 10px", fontSize: 13, cursor: "pointer", background: i === highlight ? "#f1f5f9" : "#fff" }}
            >
              {s}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ImportPdf({ categories, existingCategories, existingTransactions, onClose, onImported }) {
  const [rows, setRows] = useState([]);
  const [status, setStatus] = useState({}); // tempId -> "pending" | "validated" | "skipped"
  const [parsing, setParsing] = useState(false);
  const [parseError, setParseError] = useState("");
  const [importing, setImporting] = useState(false);

  const handleFile = async (e) => {
    const files = Array.from(e.target.files || []);
    if (files.length === 0) return;
    setParseError("");
    setParsing(true);
    try {
      let allParsed = [];
      for (const file of files) {
        const parsed = await parsePdfToTransactions(file);
        if (parsed.length === 0) {
          setParseError((prev) => (prev ? prev + " " : "") + `Aucune transaction détectée dans "${file.name}".`);
        }
        allParsed = allParsed.concat(parsed);
      }
      if (allParsed.length === 0) {
        setParsing(false);
        return;
      }
      const withCategory = allParsed.map((tx, idx) => {
        const duplicateInBatch = allParsed.some((other, otherIdx) => otherIdx !== idx && other.dateOperation === tx.dateOperation && Math.abs(other.montant - tx.montant) < 0.01);
        const proposedCat = proposeCategory(tx.description, categories);
        const guessedKeyword = (tx.description.match(/\b[A-ZÀ-Ý]{3,}\b/) || [""])[0];
        return {
          ...tx,
          category: proposedCat,
          motCle: guessedKeyword,
          duplicate: isProbableDuplicate(tx, existingTransactions) || duplicateInBatch,
        };
      });
      setRows(withCategory);
      const initStatus = {};
      withCategory.forEach((r) => { initStatus[r.tempId] = "pending"; });
      setStatus(initStatus);
    } catch (err) {
      console.error(err);
      setParseError("Impossible de lire un ou plusieurs de ces PDF. Vérifie qu'il s'agit bien d'extraits BNP Paribas Fortis au format habituel.");
    }
    setParsing(false);
  };

  const updateRow = (tempId, patch) => {
    setRows((prev) => prev.map((r) => (r.tempId === tempId ? { ...r, ...patch } : r)));
  };

  const validateRow = (tempId) => setStatus((s) => ({ ...s, [tempId]: "validated" }));
  const skipRow = (tempId) => setStatus((s) => ({ ...s, [tempId]: "skipped" }));

  const importRows = async (rowsToImport) => {
    setImporting(true);
    for (const row of rowsToImport) {
      // Si la catégorie proposée a été gardée ou modifiée (et n'est pas vide), on mémorise
      // le mot-clé pour la prochaine fois — seulement si ce n'est pas déjà connu.
      if (row.category && row.category !== "À catégoriser") {
        const alreadyKnown = row.motCle && categories.some((c) => c.mot_cle.toUpperCase() === row.motCle.toUpperCase());
        if (!alreadyKnown && row.motCle && row.motCle.trim()) {
          await supabase.from("Suivi_Tresorerie_categories").insert({ mot_cle: row.motCle.trim().toUpperCase(), categorie: row.category });
        }
      }
      await supabase.from("Suivi_Tresorerie_transactions").insert({
        date: row.dateOperation,
        label: row.description,
        amount: Math.abs(row.montant),
        type: row.type,
        category: row.category === "À catégoriser" ? null : row.category,
        numero_operation: row.numero,
        contrepartie: row.contrepartie || null,
        date_valeur: row.dateValeur,
        reference_banque: row.referenceBanque,
        source: "import",
      });
    }
    setImporting(false);
    onImported();
  };

  const handleImportOne = async (row) => {
    await importRows([row]);
    setStatus((s) => ({ ...s, [row.tempId]: "imported" }));
  };

  const handleImportAll = async () => {
    const toImport = rows.filter((r) => status[r.tempId] === "validated");
    if (toImport.length === 0) return;
    await importRows(toImport);
    const newStatus = { ...status };
    toImport.forEach((r) => { newStatus[r.tempId] = "imported"; });
    setStatus(newStatus);
  };

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" style={{maxWidth: 1000}} onClick={(e) => e.stopPropagation()}>
        <div className="row between" style={{marginBottom:12}}>
          <b>Importer un extrait PDF</b>
          <button className="btn-ghost" onClick={onClose}>✕</button>
        </div>

        {rows.length === 0 && (
          <div>
            <input type="file" accept="application/pdf" multiple onChange={handleFile} disabled={parsing} />
            <p className="small muted" style={{marginTop:6}}>Tu peux sélectionner plusieurs fichiers PDF à la fois (maintiens Ctrl ou Cmd enfoncé pour en choisir plusieurs).</p>
            {parsing && <p className="small muted" style={{marginTop:8}}>Lecture du PDF en cours…</p>}
            {parseError && <div className="save-error" style={{marginTop:8}}>{parseError}</div>}
          </div>
        )}

        {rows.length > 0 && (
          <div>
            <p className="small muted">{rows.length} transaction(s) détectée(s). Vérifie chaque ligne avant import.</p>
            <div className="tbl-scroll">
              <table>
                <thead>
                  <tr>
                    <th>N°</th><th>Description</th><th>Contrepartie</th><th>Date opération</th>
                    <th>Date valeur</th><th className="right">Montant</th><th>Catégorie proposée</th><th>Action</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => (
                    <tr key={r.tempId} style={{opacity: status[r.tempId] === "skipped" ? 0.4 : 1}}>
                      <td>{r.numero}</td>
                      <td style={{maxWidth:220,fontSize:12}}>{r.description}</td>
                      <td style={{fontSize:12}}>{r.contrepartie || "—"}</td>
                      <td>{r.dateOperation}</td>
                      <td>{r.dateValeur || "—"}</td>
                      <td className="right" style={{color: r.type==="expense"?"var(--red)":"var(--green)"}}>{r.type==="expense"?"-":"+"}{fmt(Math.abs(r.montant))}</td>
                      <td>
                        <CategoryInput
                          style={{width:120,marginBottom:4}}
                          inputStyle={{fontSize:12}}
                          value={r.category}
                          placeholder="Catégorie"
                          suggestions={existingCategories}
                          disabled={status[r.tempId] === "imported"}
                          onChange={(val) => updateRow(r.tempId, { category: val })}
                        />
                        <input
                          style={{width:120,fontSize:12}}
                          value={r.motCle}
                          placeholder="Mot-clé à retenir"
                          disabled={status[r.tempId] === "imported"}
                          onChange={(e) => updateRow(r.tempId, { motCle: e.target.value })}
                        />
                        {r.duplicate && status[r.tempId] === "pending" && (
                          <div className="small" style={{color:"var(--amber)",marginTop:4}}>
                            Doublon possible.
                            <button className="btn-ghost" style={{padding:"2px 4px"}} onClick={() => updateRow(r.tempId, { duplicate: false })}>Non, importer</button>
                            <button className="btn-ghost" style={{padding:"2px 4px"}} onClick={() => skipRow(r.tempId)}>Oui, ignorer</button>
                          </div>
                        )}
                      </td>
                      <td>
                        {status[r.tempId] === "imported" ? (
                          <span className="small" style={{color:"var(--green)"}}>Importé ✓</span>
                        ) : status[r.tempId] === "skipped" ? (
                          <span className="small muted">Ignoré</span>
                        ) : status[r.tempId] === "validated" ? (
                          <button className="btn" style={{fontSize:12}} onClick={() => handleImportOne(r)} disabled={importing}>Importer</button>
                        ) : (
                          <div className="row" style={{gap:4}}>
                            <button className="btn" style={{fontSize:12,padding:"4px 8px"}} onClick={() => validateRow(r.tempId)} disabled={r.duplicate}>Valider</button>
                            <button className="btn-ghost" style={{fontSize:12}} onClick={() => skipRow(r.tempId)}>Ignorer</button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <div className="row between" style={{marginTop:12}}>
              <span className="small muted">{rows.filter(r=>status[r.tempId]==="validated").length} validée(s) en attente d'import</span>
              <button className="btn btn-dark" onClick={handleImportAll} disabled={importing}>Importer tout ce qui est validé</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function Tracker({ onLogout }) {
  const { data, setDataState, saveError, setSaveError, loadError, reload } = useTrackerData();
  const [tab, setTab] = useState("hebdo");
  const [showRecurring, setShowRecurring] = useState(false);
  const [showAddTx, setShowAddTx] = useState(false);
  const [newRecurring, setNewRecurring] = useState({ label: "", amount: "", type: "expense", day: "1" });
  const [newTx, setNewTx] = useState({ date: todayISO(), label: "", amount: "", type: "expense", category: "" });
  const [showImportPdf, setShowImportPdf] = useState(false);
  const [sortKey, setSortKey] = useState("dateValeur");
  const [sortDir, setSortDir] = useState("desc");
  const [editingCategoryId, setEditingCategoryId] = useState(null);
  const [editingCategoryValue, setEditingCategoryValue] = useState("");

  if (loadError) {
    return (
      <div className="wrap">
        <div className="save-error">Impossible de charger les données depuis Supabase. Vérifie ta connexion internet, puis réessaie.</div>
        <button className="btn" style={{marginTop:12}} onClick={reload}>Réessayer</button>
      </div>
    );
  }

  if (!data) return <div className="wrap"><p className="muted">Chargement…</p></div>;

  const { settings, recurring, transactions } = data;
  const allCategories = useMemo(() => {
    const set = new Set();
    (data.categories || []).forEach((c) => c.categorie && set.add(c.categorie));
    transactions.forEach((t) => t.category && set.add(t.category));
    return Array.from(set).sort((a, b) => a.localeCompare(b, "fr"));
  }, [data.categories, transactions]);
  const events = buildEvents(recurring, transactions);
  const weeks = buildWeeks(settings.openingDate);

  let running = settings.openingBalance;
  const weekRows = weeks.map((w) => {
    const weekEvents = events.filter((e) => dateInRange(e.date, w.start, w.end));
    const recette = weekEvents.filter((e) => e.amount > 0).reduce((s, e) => s + e.amount, 0);
    const depense = weekEvents.filter((e) => e.amount < 0).reduce((s, e) => s + e.amount, 0);
    const net = recette + depense;
    running += net;
    return { ...w, net, recette, depense, balance: running, events: weekEvents };
  });

  let runningM = settings.openingBalance;
  const monthRows = MONTHS.map((name, m) => {
    const monthEvents = events.filter((e) => e.month === m);
    const recette = monthEvents.filter((e) => e.amount > 0).reduce((s, e) => s + e.amount, 0);
    const depense = monthEvents.filter((e) => e.amount < 0).reduce((s, e) => s + e.amount, 0);
    const net = recette + depense;
    runningM += net;
    return { name, recette, depense, net, balance: runningM };
  });

  const currentBalance = weekRows.length ? weekRows[weekRows.length - 1].balance : settings.openingBalance;

  const toggleSort = (key) => {
    if (sortKey === key) {
      setSortDir(sortDir === "asc" ? "desc" : "asc");
    } else {
      setSortKey(key);
      setSortDir("asc");
    }
  };

  const sortedTransactions = [...transactions].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === "dateValeur") { va = va || a.date; vb = vb || b.date; }
    if (va === null || va === undefined) va = "";
    if (vb === null || vb === undefined) vb = "";
    if (typeof va === "string") va = va.toLowerCase();
    if (typeof vb === "string") vb = vb.toLowerCase();
    if (va < vb) return sortDir === "asc" ? -1 : 1;
    if (va > vb) return sortDir === "asc" ? 1 : -1;
    return 0;
  });
  const firstDangerWeek = weekRows.find((w) => w.balance < settings.alertThreshold);
  const firstNegativeWeek = weekRows.find((w) => w.balance < 0);
  const balanceColor = currentBalance < 0 ? "var(--red)" : currentBalance < settings.alertThreshold ? "var(--amber)" : "var(--green)";

  const addRecurring = async () => {
    if (!newRecurring.label || !newRecurring.amount) return;
    const row = {
      label: newRecurring.label,
      amount: parseFloat(newRecurring.amount),
      type: newRecurring.type,
      day: Math.min(31, Math.max(1, parseInt(newRecurring.day) || 1)),
    };
    const { data: inserted, error } = await supabase.from("Suivi_Tresorerie_recurring").insert(row).select().single();
    if (error) { setSaveError(true); return; }
    setSaveError(false);
    setDataState({ ...data, recurring: [...recurring, { id: inserted.id, ...row }] });
    setNewRecurring({ label: "", amount: "", type: "expense", day: "1" });
  };

  const removeRecurring = async (id) => {
    const { error } = await supabase.from("Suivi_Tresorerie_recurring").delete().eq("id", id);
    if (error) { setSaveError(true); return; }
    setSaveError(false);
    setDataState({ ...data, recurring: recurring.filter((r) => r.id !== id) });
  };

  const updateRecurringDay = async (id, day) => {
    setDataState({ ...data, recurring: recurring.map((x) => x.id === id ? { ...x, day } : x) });
    const { error } = await supabase.from("Suivi_Tresorerie_recurring").update({ day }).eq("id", id);
    if (error) setSaveError(true); else setSaveError(false);
  };

  const addTx = async () => {
    if (!newTx.label || !newTx.amount || !newTx.date) return;
    const row = {
      date: newTx.date, label: newTx.label,
      amount: parseFloat(newTx.amount), type: newTx.type, category: newTx.category,
      source: "manuel",
    };
    const { data: inserted, error } = await supabase.from("Suivi_Tresorerie_transactions").insert(row).select().single();
    if (error) { setSaveError(true); return; }
    setSaveError(false);
    setDataState({ ...data, transactions: [...transactions, { id: inserted.id, date: row.date, label: row.label, amount: row.amount, type: row.type, category: row.category, dateValeur: null, numeroOperation: null, contrepartie: null, referenceBanque: null, source: "manuel" }] });
    setNewTx({ date: todayISO(), label: "", amount: "", type: "expense", category: "" });
    setShowAddTx(false);
  };

  const removeTx = async (id) => {
    const { error } = await supabase.from("Suivi_Tresorerie_transactions").delete().eq("id", id);
    if (error) { setSaveError(true); return; }
    setSaveError(false);
    setDataState({ ...data, transactions: transactions.filter((t) => t.id !== id) });
  };

  const saveCategoryEdit = async (id) => {
    const newCategory = editingCategoryValue.trim() || null;
    const { error } = await supabase.from("Suivi_Tresorerie_transactions").update({ category: newCategory }).eq("id", id);
    if (error) { setSaveError(true); return; }
    setSaveError(false);
    setDataState({ ...data, transactions: transactions.map((t) => (t.id === id ? { ...t, category: newCategory } : t)) });
    setEditingCategoryId(null);
  };

  const updateSetting = async (key, value) => {
    setDataState({ ...data, settings: { ...settings, [key]: value } });
    const dbKey = key === "openingBalance" ? "opening_balance" : key === "openingDate" ? "opening_date" : "alert_threshold";
    const { error } = await supabase.from("Suivi_Tresorerie_settings").update({ [dbKey]: value }).eq("id", 1);
    if (error) setSaveError(true); else setSaveError(false);
  };

  return (
    <div className="wrap">
      <div className="row between">
        <div className="row">
          <div style={{width:40,height:40,borderRadius:10,background:"var(--dark)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:18}}>€</div>
          <div>
            <div style={{fontWeight:700,fontSize:17}}>MUNDO ASBL</div>
            <div className="small muted">Suivi de trésorerie — 2026</div>
          </div>
        </div>
        <div className="row">
          <button className="btn" onClick={() => setShowImportPdf(true)}>📄 Importer un extrait PDF</button>
          <button className="btn" onClick={() => setShowRecurring(true)}>⚙ Dépenses fixes & paramètres</button>
          <button className="btn" onClick={onLogout}>Déconnexion</button>
        </div>
      </div>

      {showImportPdf && (
        <ImportPdf
          categories={data.categories || []}
          existingCategories={allCategories}
          existingTransactions={transactions}
          onClose={() => setShowImportPdf(false)}
          onImported={reload}
        />
      )}

      {saveError && <div className="save-error" style={{marginTop:12}}>La sauvegarde vers Supabase a échoué. Vérifie ta connexion, tes modifications récentes n'ont peut-être pas été enregistrées.</div>}

      <div className="grid3" style={{marginTop:16}}>
        <div className="card">
          <p className="stat-label">Trésorerie actuelle (projetée)</p>
          <p className="stat-value" style={{color:balanceColor}}>{fmt(currentBalance)}</p>
        </div>
        <div className="card">
          <p className="stat-label">Solde de départ (01/01/2026)</p>
          <p className="stat-value">{fmt(settings.openingBalance)}</p>
        </div>
        <div className="card">
          <p className="stat-label">Seuil d'alerte</p>
          <p className="stat-value">{fmt(settings.alertThreshold)}</p>
        </div>
      </div>

      {(firstDangerWeek || firstNegativeWeek) && (
        <div className={`banner ${firstNegativeWeek ? "red" : "amber"}`} style={{marginTop:16}}>
          <span>⚠</span>
          {firstNegativeWeek ? (
            <span><b>Trésorerie négative projetée</b> à partir de la semaine du {shortDate(firstNegativeWeek.start)} au {shortDate(firstNegativeWeek.end)}.</span>
          ) : (
            <span><b>Sous le seuil d'alerte</b> à partir de la semaine du {shortDate(firstDangerWeek.start)} au {shortDate(firstDangerWeek.end)}.</span>
          )}
        </div>
      )}

      <div className="card" style={{marginTop:16}}>
        <p style={{fontSize:14,fontWeight:600,marginTop:0}}>Évolution de la trésorerie (semaine par semaine)</p>
        <MiniChart points={weekRows} threshold={settings.alertThreshold} />
      </div>

      <div className="tabs">
        <button className={`tab ${tab==="hebdo"?"active":""}`} onClick={() => setTab("hebdo")}>Vue hebdomadaire</button>
        <button className={`tab ${tab==="mensuel"?"active":""}`} onClick={() => setTab("mensuel")}>Vue mensuelle</button>
      </div>

      {tab === "hebdo" && (
        <div className="card" style={{padding:0}}>
          <div className="tbl-scroll">
            <table>
              <thead><tr><th>Semaine</th><th className="right">Recettes</th><th className="right">Dépenses</th><th className="right">Net</th><th className="right">Solde</th></tr></thead>
              <tbody>
                {weekRows.map((w) => (
                  <tr key={w.index}>
                    <td style={{whiteSpace:"nowrap"}} className="muted">S{w.index} · {shortDate(w.start)}–{shortDate(w.end)}</td>
                    <td className="right" style={{color:"var(--green)"}}>{w.recette?fmt(w.recette):"—"}</td>
                    <td className="right" style={{color:"var(--red)"}}>{w.depense?fmt(w.depense):"—"}</td>
                    <td className="right" style={{color: w.net<0?"var(--red)":w.net>0?"var(--green)":"#94a3b8"}}>{w.net!==0?fmt(w.net):"—"}</td>
                    <td className="right" style={{fontWeight:600,color: w.balance<0?"var(--red)":w.balance<settings.alertThreshold?"var(--amber)":"#1e293b"}}>{fmt(w.balance)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === "mensuel" && (
        <div className="card" style={{padding:0}}>
          <table>
            <thead><tr><th>Mois</th><th className="right">Recettes</th><th className="right">Dépenses</th><th className="right">Net</th><th className="right">Solde fin de mois</th></tr></thead>
            <tbody>
              {monthRows.map((m) => (
                <tr key={m.name}>
                  <td>{m.name}</td>
                  <td className="right" style={{color:"var(--green)"}}>{fmt(m.recette)}</td>
                  <td className="right" style={{color:"var(--red)"}}>{fmt(m.depense)}</td>
                  <td className="right" style={{color: m.net<0?"var(--red)":"var(--green)"}}>{fmt(m.net)}</td>
                  <td className="right" style={{fontWeight:700,color: m.balance<0?"var(--red)":m.balance<settings.alertThreshold?"var(--amber)":"#1e293b"}}>{fmt(m.balance)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="card" style={{marginTop:16,padding:0}}>
        <p style={{fontSize:14,fontWeight:600,padding:"16px 16px 0"}}>Toutes les transactions</p>
        <div className="tbl-scroll">
          <table>
            <thead>
              <tr>
                <th style={{cursor:"pointer"}} onClick={() => toggleSort("dateValeur")}>Date valeur {sortKey==="dateValeur" ? (sortDir==="asc"?"▲":"▼") : ""}</th>
                <th style={{cursor:"pointer"}} onClick={() => toggleSort("label")}>Description {sortKey==="label" ? (sortDir==="asc"?"▲":"▼") : ""}</th>
                <th style={{cursor:"pointer"}} onClick={() => toggleSort("category")}>Catégorie {sortKey==="category" ? (sortDir==="asc"?"▲":"▼") : ""}</th>
                <th className="right" style={{cursor:"pointer"}} onClick={() => toggleSort("amount")}>Montant {sortKey==="amount" ? (sortDir==="asc"?"▲":"▼") : ""}</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {sortedTransactions.map((t) => (
                <tr key={t.id}>
                  <td className="muted" style={{whiteSpace:"nowrap"}}>{t.dateValeur ? new Date(t.dateValeur+"T00:00:00").toLocaleDateString("fr-BE") : "—"}</td>
                  <td style={{maxWidth:360}}>{t.label}</td>
                  <td className="muted">
                    {editingCategoryId === t.id ? (
                      <div className="row" style={{gap:4}}>
                        <CategoryInput
                          style={{width:110}}
                          inputStyle={{fontSize:12}}
                          value={editingCategoryValue}
                          onChange={setEditingCategoryValue}
                          suggestions={allCategories}
                          onSubmit={() => saveCategoryEdit(t.id)}
                          autoFocus
                        />
                        <button className="btn-ghost" style={{padding:"2px 4px"}} onClick={() => saveCategoryEdit(t.id)}>✓</button>
                        <button className="btn-ghost" style={{padding:"2px 4px"}} onClick={() => setEditingCategoryId(null)}>✕</button>
                      </div>
                    ) : (
                      <span style={{cursor:"pointer"}} onClick={() => { setEditingCategoryId(t.id); setEditingCategoryValue(t.category || ""); }}>
                        {t.category || "—"} <span className="small muted">✎</span>
                      </span>
                    )}
                  </td>
                  <td className="right" style={{color: t.type==="expense"?"var(--red)":"var(--green)"}}>{t.type==="expense"?"-":"+"}{fmt(Math.abs(t.amount))}</td>
                  <td><button className="btn-ghost" onClick={()=>removeTx(t.id)}>🗑</button></td>
                </tr>
              ))}
              {sortedTransactions.length===0 && (
                <tr><td colSpan="5" className="small muted" style={{padding:16}}>Aucune transaction enregistrée.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      <div className="card" style={{marginTop:16}}>
        <div className="row between">
          <p style={{fontSize:14,fontWeight:600,margin:0}}>📅 Dépenses & recettes ponctuelles</p>
          <button className="btn btn-dark" onClick={() => setShowAddTx(true)}>+ Ajouter</button>
        </div>

        {showAddTx && (
          <div className="card" style={{background:"#f8fafc",marginTop:12}}>
            <div className="row" style={{marginBottom:8}}>
              <input type="date" value={newTx.date} onChange={e=>setNewTx({...newTx,date:e.target.value})} />
              <select value={newTx.type} onChange={e=>setNewTx({...newTx,type:e.target.value})}>
                <option value="expense">Dépense</option>
                <option value="income">Recette</option>
              </select>
            </div>
            <input style={{width:"100%",marginBottom:8}} type="text" placeholder="Description (ex: Réparation matériel)" value={newTx.label} onChange={e=>setNewTx({...newTx,label:e.target.value})} />
            <div className="row" style={{marginBottom:8}}>
              <CategoryInput style={{flex:1}} placeholder="Catégorie (optionnel)" value={newTx.category} onChange={(val)=>setNewTx({...newTx,category:val})} suggestions={allCategories} />
              <input style={{flex:1}} type="number" step="0.01" placeholder="Montant €" value={newTx.amount} onChange={e=>setNewTx({...newTx,amount:e.target.value})} />
            </div>
            <div className="row" style={{justifyContent:"flex-end"}}>
              <button className="btn" onClick={()=>setShowAddTx(false)}>Annuler</button>
              <button className="btn btn-dark" onClick={addTx}>Enregistrer</button>
            </div>
          </div>
        )}

        {transactions.length===0 ? (
          <p className="small muted">Aucune transaction ponctuelle enregistrée.</p>
        ) : (
          <div style={{maxHeight:220,overflowY:"auto",marginTop:12}}>
            {[...transactions].sort((a,b)=>a.date<b.date?1:-1).map(t=>(
              <div key={t.id} className="row between" style={{fontSize:14,padding:"6px 0",borderBottom:"1px solid #f1f5f9"}}>
                <div className="row">
                  <span className="small muted">{new Date(t.date+"T00:00:00").toLocaleDateString("fr-BE")}</span>
                  <span>{t.label}</span>
                  {t.category && <span className="small muted">· {t.category}</span>}
                </div>
                <div className="row">
                  <span style={{color: t.type==="expense"?"var(--red)":"var(--green)"}}>{t.type==="expense"?"-":"+"}{fmt(Math.abs(t.amount))}</span>
                  <button className="btn-ghost" onClick={()=>removeTx(t.id)}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <p className="footer-note">Chaque dépense/recette fixe est appliquée au jour du mois défini. Vos données sont sauvegardées de façon sécurisée dans Supabase (accès protégé par mot de passe).</p>

      {showRecurring && (
        <div className="modal-bg" onClick={()=>setShowRecurring(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div className="row between" style={{marginBottom:12}}>
              <b>Dépenses fixes & paramètres</b>
              <button className="btn-ghost" onClick={()=>setShowRecurring(false)}>✕</button>
            </div>

            <p className="small muted" style={{fontWeight:600}}>Paramètres</p>
            <div className="row" style={{marginBottom:16}}>
              <label className="small muted" style={{flex:1}}>Solde au 01/01/2026
                <input style={{width:"100%",marginTop:4}} type="number" step="0.01" value={settings.openingBalance} onChange={e=>updateSetting("openingBalance",parseFloat(e.target.value)||0)} />
              </label>
              <label className="small muted" style={{flex:1}}>Seuil d'alerte
                <input style={{width:"100%",marginTop:4}} type="number" step="0.01" value={settings.alertThreshold} onChange={e=>updateSetting("alertThreshold",parseFloat(e.target.value)||0)} />
              </label>
            </div>

            <p className="small muted" style={{fontWeight:600}}>Dépenses / recettes fixes mensuelles</p>
            {recurring.map(r=>(
              <div key={r.id} className="item-row">
                <span>{r.label}</span>
                <div className="row">
                  <span className="small muted">le <input type="number" min="1" max="31" value={r.day||1} style={{width:44,textAlign:"center"}} onChange={e=>updateRecurringDay(r.id, Math.min(31,Math.max(1,parseInt(e.target.value)||1)))} /> du mois</span>
                  <span style={{color: r.type==="expense"?"var(--red)":"var(--green)"}}>{r.type==="expense"?"-":"+"}{fmt(r.amount)}</span>
                  <button className="btn-ghost" onClick={()=>removeRecurring(r.id)}>🗑</button>
                </div>
              </div>
            ))}
            {recurring.length===0 && <p className="small muted">Aucune dépense fixe enregistrée.</p>}

            <div className="card" style={{background:"#f8fafc",marginTop:10}}>
              <input style={{width:"100%",marginBottom:8}} type="text" placeholder="Nom (ex: Loyer, Assurance...)" value={newRecurring.label} onChange={e=>setNewRecurring({...newRecurring,label:e.target.value})} />
              <div className="row" style={{marginBottom:8}}>
                <select style={{flex:1}} value={newRecurring.type} onChange={e=>setNewRecurring({...newRecurring,type:e.target.value})}>
                  <option value="expense">Dépense</option>
                  <option value="income">Recette</option>
                </select>
                <input style={{flex:1}} type="number" step="0.01" placeholder="Montant €" value={newRecurring.amount} onChange={e=>setNewRecurring({...newRecurring,amount:e.target.value})} />
                <input style={{width:80}} type="number" min="1" max="31" placeholder="Jour" value={newRecurring.day} onChange={e=>setNewRecurring({...newRecurring,day:e.target.value})} />
              </div>
              <button className="btn btn-dark" style={{width:"100%",justifyContent:"center"}} onClick={addRecurring}>+ Ajouter</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ============================================
// APPLICATION RACINE — gère l'état de connexion
// ============================================
function App() {
  const [session, setSession] = useState(undefined); // undefined = en cours de vérification

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabase.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const handleLogout = async () => {
    await supabase.auth.signOut();
  };

  if (session === undefined) {
    return <div className="wrap"><p className="muted">Chargement…</p></div>;
  }

  if (!session) {
    return <Login onLoggedIn={setSession} />;
  }

  return <Tracker onLogout={handleLogout} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
